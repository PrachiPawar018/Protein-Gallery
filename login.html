<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card p-5 wow fadeInUp">
                    <h2 class="mb-3">Welcome back</h2>
                    <p class="text-muted mb-4">Sign in to your Protein Gallery account.</p>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" class="form-control" placeholder="you@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="••••••••">
                        </div>
                        <button class="btn btn-primary w-100 py-3">Login</button>
                    </form>
                    <div class="d-flex justify-content-between mt-3 small">
                        <a href="register.html" class="text-primary">Create account</a>
                        <a href="forgot-password.html" class="text-primary">Forgot password?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
