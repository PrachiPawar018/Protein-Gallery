<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Protein Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header-bar">
    <div class="container navbar">
        <a class="brand" href="index.html"><span class="dot">PG</span> Protein Gallery</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html" class="active">Cart</a>
        </nav>
    </div>
</header>
<div id="toast-container"></div>
<main class="container page-header">
    <div class="section-header">
        <h1 class="section-title">Your cart</h1>
        <p class="section-subtitle">Review your selected items and update quantities before checkout.</p>
    </div>
    <div id="cartContent"></div>
</main>
<script src="js/main.js"></script>
<script>
    async function loadCart() {
        const items = await fetchJson(api.cart);
        const container = document.getElementById('cartContent');
        if (!Array.isArray(items) || items.length === 0) {
            container.innerHTML = '<div class="card"><p style="color:var(--muted);">Your cart is currently empty.</p><a class="btn-primary" href="shop.html">Browse products</a></div>';
            return;
        }
        let total = 0;
        const rows = items.map(item => {
            total += item.totalPrice;
            return `
                <div class="card" style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
                    <img src="${item.imageUrl}" alt="${item.productName}" style="width:120px; border-radius:18px; object-fit:cover;" />
                    <div style="flex:1; min-width:200px;">
                        <h3>${item.productName}</h3>
                        <p style="color:var(--muted);">${formatCurrency(item.unitPrice)} each</p>
                        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px;">
                            <input class="text-field" type="number" min="1" value="${item.quantity}" id="qty-${item.id}" style="width:100px;" />
                            <button class="btn-secondary" onclick="updateQuantity(${item.id})">Update</button>
                            <button class="btn-secondary" onclick="removeItem(${item.id})">Remove</button>
                        </div>
                    </div>
                    <div style="text-align:right; min-width:120px;">
                        <div class="price-tag">${formatCurrency(item.totalPrice)}</div>
                    </div>
                </div>
            `;
        }).join('');
        container.innerHTML = `
            <div class="product-detail">
                <div style="width: 100%;">${rows}</div>
                <div class="summary-card card">
                    <h3>Order summary</h3>
                    <p style="margin:0; color:var(--muted);">Total for ${items.length} items.</p>
                    <div class="price-tag" style="margin-top:24px;">${formatCurrency(total)}</div>
                    <a class="btn-primary" href="checkout.html" style="margin-top:24px; display:inline-block;">Checkout now</a>
                </div>
            </div>
        `;
    }

    async function updateQuantity(cartId) {
        const input = document.getElementById(`qty-${cartId}`);
        const result = await fetchJson(`${api.cart}/update`, {
            method: 'POST',
            body: new URLSearchParams({ cartId, quantity: input.value }),
        });
        showToast(result.success ? 'Quantity updated' : 'Unable to update cart', result.success ? 'success' : 'error');
        loadCart();
    }

    async function removeItem(cartId) {
        const result = await fetchJson(`${api.cart}/remove`, {
            method: 'POST',
            body: new URLSearchParams({ cartId }),
        });
        showToast(result.success ? 'Item removed' : 'Unable to remove item', result.success ? 'success' : 'error');
        loadCart();
    }

    document.addEventListener('DOMContentLoaded', loadCart);
</script>
</body>
</html>
