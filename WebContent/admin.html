<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Protein Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header-bar">
    <div class="container navbar">
        <a class="brand" href="index.html"><span class="dot">PG</span> Protein Gallery</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">Orders</a>
            <a href="admin.html" class="active">Admin</a>
        </nav>
        <div class="nav-actions">
            <div id="navAuth" class="nav-auth">
                <a class="btn-secondary" href="login.html">Login</a>
                <a class="btn-primary" href="register.html">Sign Up</a>
            </div>
            <div id="navUser" class="user-menu" style="display:none; gap:12px; align-items:center;">
                <span class="user-name"></span>
                <button class="btn-secondary" id="logoutButton">Logout</button>
            </div>
        </div>
    </div>
</header>
<div id="toast-container"></div>
<main class="container page-header">
    <div class="section-header">
        <h1 class="section-title">Admin dashboard</h1>
        <p class="section-subtitle">A simple backend panel for product and user overview.</p>
    </div>
    <div class="product-grid">
        <div class="card">
            <h3>Key metrics</h3>
            <div id="statsGrid" style="display:grid; gap:12px; margin-top:18px;"></div>
        </div>
        <div class="card">
            <h3>Recent products</h3>
            <div id="productsAdmin"></div>
        </div>
        <div class="card">
            <h3>Users</h3>
            <div id="usersAdmin"></div>
        </div>
    </div>
</main>
<script src="js/main.js"></script>
<script>
    async function loadAdmin() {
        const session = await getSession();
        if (!session.authenticated || session.role !== 'admin') {
            showToast('Admin access required', 'error');
            setTimeout(() => window.location.href = 'login.html', 700);
            return;
        }
        const stats = await fetchJson(`${api.admin}/stats`);
        document.getElementById('statsGrid').innerHTML = `
            <div class="card"><strong>Users</strong><p>${stats.users || 0}</p></div>
            <div class="card"><strong>Products</strong><p>${stats.products || 0}</p></div>
            <div class="card"><strong>Orders</strong><p>${stats.orders || 0}</p></div>
        `;
        const products = await fetchJson(`${api.admin}/products`);
        const users = await fetchJson(`${api.admin}/users`);
        if (Array.isArray(products) && products.length) {
            document.getElementById('productsAdmin').innerHTML = products.slice(0, 6).map(product => `<p>${product.name} — ${product.category} — ${formatCurrency(product.price)}</p>`).join('');
        } else {
            document.getElementById('productsAdmin').innerHTML = '<p style="color:var(--muted);">No products found.</p>';
        }
        if (Array.isArray(users) && users.length) {
            document.getElementById('usersAdmin').innerHTML = users.slice(0, 8).map(user => `<p>${user.name} — ${user.email} — ${user.role}</p>`).join('');
        } else {
            document.getElementById('usersAdmin').innerHTML = '<p style="color:var(--muted);">No users found.</p>';
        }
    }
    document.addEventListener('DOMContentLoaded', loadAdmin);
</script>
</body>
</html>
