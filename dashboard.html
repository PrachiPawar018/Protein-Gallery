<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Dashboard</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row g-4 mb-4">
            <div class="col-md-3"><div class="stat-card"><h6 class="text-muted">Orders</h6><div class="counter" data-count="128">0</div></div></div>
            <div class="col-md-3"><div class="stat-card"><h6 class="text-muted">Wishlist</h6><div class="counter" data-count="24">0</div></div></div>
            <div class="col-md-3"><div class="stat-card"><h6 class="text-muted">Saved Addresses</h6><div class="counter" data-count="3">0</div></div></div>
            <div class="col-md-3"><div class="stat-card"><h6 class="text-muted">Loyalty Points</h6><div class="counter" data-count="4800">0</div></div></div>
        </div>
        <div class="section-shell p-4">
            <h4 class="mb-3">Recent activity</h4>
            <div class="timeline-item">Order #PG-1024 shipped successfully.</div>
            <div class="timeline-item">New wishlist item added to your recovery stack.</div>
            <div class="timeline-item">Invoice downloaded for your latest purchase.</div>
        </div>
    </div>
</body>
</html>
