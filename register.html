<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Register</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="shared-navbar"></div>

    <!-- Register Container -->
    <div class="container py-5" style="margin-top: 90px;">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="auth-card p-4 p-md-5 bg-white shadow-lg rounded-4 border-0">
                    <div class="text-center mb-4">
                        <div class="brand-mark mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h2 class="fw-bold mb-2">Create Your Account</h2>
                        <p class="text-muted">Join Protein Gallery for exclusive rewards and fast checkout.</p>
                    </div>

                    <form id="registerForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="regName" class="form-control border-start-0 py-2" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                    <input type="email" id="regEmail" class="form-control border-start-0 py-2" placeholder="you@example.com" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-phone text-muted"></i></span>
                                    <input type="tel" id="regPhone" class="form-control border-start-0 py-2" placeholder="9876543210" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                    <input type="password" id="regPassword" class="form-control border-start-0 border-end-0 py-2" placeholder="At least 6 chars" required>
                                    <button type="button" class="btn btn-light border border-start-0 toggle-password" data-target="regPassword">
                                        <i class="fas fa-eye text-muted"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                    <input type="password" id="regConfirmPassword" class="form-control border-start-0 border-end-0 py-2" placeholder="Repeat password" required>
                                    <button type="button" class="btn btn-light border border-start-0 toggle-password" data-target="regConfirmPassword">
                                        <i class="fas fa-eye text-muted"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="regBtn" class="btn btn-primary w-100 py-3 fw-bold rounded-3 d-flex align-items-center justify-content-center gap-2">
                            <span>Register Account</span>
                            <span id="regSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top small">
                        <span class="text-muted">Already registered?</span>
                        <a href="login.html" class="text-primary fw-bold ms-1 text-decoration-none">Sign In Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="shared-footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Toast notification helper
        function showToast(message, type = 'info') {
            if (window.App && App.toast) {
                App.toast(message, type);
            } else {
                alert(message);
            }
        }

        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const input = document.getElementById(targetId);
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });

        // Register Form Handler with REST API
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const btn = document.getElementById('regBtn');
            const spinner = document.getElementById('regSpinner');

            // Validations
            if (!name) {
                showToast('Please enter your full name.', 'error');
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showToast('Please enter a valid email address.', 'error');
                return;
            }
            if (phone_number && !/^[0-9]{10}$/.test(phone_number)) {
                showToast('Phone number must be exactly 10 digits.', 'error');
                return;
            }
            if (!password || password.length < 6) {
                showToast('Password must be at least 6 characters long.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showToast('Passwords do not match!', 'error');
                return;
            }

            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone_number, password })
                });
                const result = await res.json();

                if (result.success) {
                    showToast('✓ Account created successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } else {
                    showToast(result.message || 'Registration failed.', 'error');
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                }
            } catch (err) {
                showToast('An error occurred. Please try again.', 'error');
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
