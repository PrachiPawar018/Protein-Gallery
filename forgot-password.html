<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Forgot Password</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="shared-navbar"></div>

    <!-- Forgot Password Container -->
    <div class="container py-5" style="margin-top: 100px;">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card p-4 p-md-5 bg-white shadow-lg rounded-4 border-0">
                    <div class="text-center mb-4">
                        <div class="brand-mark mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
                            <i class="fas fa-key"></i>
                        </div>
                        <h2 class="fw-bold mb-2">Reset Password</h2>
                        <p id="stepDescription" class="text-muted">Enter your email to receive a 6-digit OTP code.</p>
                    </div>

                    <!-- STEP 1: Request OTP -->
                    <form id="requestOtpForm">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Registered Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="resetEmail" class="form-control border-start-0 py-2" placeholder="you@example.com" required>
                            </div>
                        </div>

                        <button type="submit" id="requestOtpBtn" class="btn btn-primary w-100 py-3 fw-bold rounded-3 d-flex align-items-center justify-content-center gap-2">
                            <span>Send OTP</span>
                            <span id="requestSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>

                    <!-- STEP 2: Verify OTP & New Password (Hidden Initially) -->
                    <form id="resetPasswordForm" class="d-none">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Enter 6-Digit OTP</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-shield-alt text-muted"></i></span>
                                <input type="text" id="otpCode" class="form-control border-start-0 py-2 text-center letter-spacing-2 fw-bold" placeholder="123456" maxlength="6" required>
                            </div>
                            <small id="otpDevNote" class="text-success d-none mt-1 d-block"></small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="newPassword" class="form-control border-start-0 border-end-0 py-2" placeholder="••••••••" required>
                                <button type="button" class="btn btn-light border border-start-0 toggle-password" data-target="newPassword">
                                    <i class="fas fa-eye text-muted"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="confirmNewPassword" class="form-control border-start-0 border-end-0 py-2" placeholder="••••••••" required>
                                <button type="button" class="btn btn-light border border-start-0 toggle-password" data-target="confirmNewPassword">
                                    <i class="fas fa-eye text-muted"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="resetPasswordBtn" class="btn btn-primary w-100 py-3 fw-bold rounded-3 d-flex align-items-center justify-content-center gap-2">
                            <span>Update Password</span>
                            <span id="resetSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top small">
                        <a href="login.html" class="text-primary fw-bold text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="shared-footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentEmail = '';

        // Toast notification helper
        function showToast(message, type = 'info') {
            if (window.App && App.toast) {
                App.toast(message, type);
            } else {
                alert(message);
            }
        }

        // Step 1: Request OTP via REST API
        document.getElementById('requestOtpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const btn = document.getElementById('requestOtpBtn');
            const spinner = document.getElementById('requestSpinner');

            if (!email) {
                showToast('Please enter your email.', 'error');
                return;
            }

            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await res.json();

                if (!result.success) {
                    showToast(result.message || 'Failed to send OTP.', 'error');
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                    return;
                }

                currentEmail = email;
                showToast('✓ OTP sent to your email!', 'success');

                if (result.otp) {
                    const devNote = document.getElementById('otpDevNote');
                    devNote.textContent = `[Demo Mode] Your OTP: ${result.otp}`;
                    devNote.classList.remove('d-none');
                }

                // Switch form to Step 2
                document.getElementById('requestOtpForm').classList.add('d-none');
                document.getElementById('resetPasswordForm').classList.remove('d-none');
                document.getElementById('stepDescription').textContent = `Enter the OTP sent to ${email} and your new password.`;

                btn.disabled = false;
                spinner.classList.add('d-none');
            } catch (err) {
                showToast('An error occurred. Please try again.', 'error');
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });

        // Step 2: Verify OTP & Reset Password via REST API
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const otp = document.getElementById('otpCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            const btn = document.getElementById('resetPasswordBtn');
            const spinner = document.getElementById('resetSpinner');

            if (!otp || otp.length !== 6) {
                showToast('Please enter the 6-digit OTP code.', 'error');
                return;
            }
            if (!newPassword || newPassword.length < 6) {
                showToast('New password must be at least 6 characters.', 'error');
                return;
            }
            if (newPassword !== confirmNewPassword) {
                showToast('Passwords do not match!', 'error');
                return;
            }

            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp, newPassword })
                });
                const result = await res.json();

                if (result.success) {
                    showToast('✓ Password updated successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } else {
                    showToast(result.message || 'Failed to reset password.', 'error');
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                }
            } catch (err) {
                showToast('An error occurred. Please try again.', 'error');
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
