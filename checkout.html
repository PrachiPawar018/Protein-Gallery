<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Checkout</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="checkout-card p-4 mb-4">
                    <h4 class="mb-3">Shipping Address</h4>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6"><input class="form-control" placeholder="Full name"></div>
                            <div class="col-md-6"><input class="form-control" placeholder="Phone number"></div>
                            <div class="col-12"><input class="form-control" placeholder="Address"></div>
                            <div class="col-md-6"><input class="form-control" placeholder="City"></div>
                            <div class="col-md-6"><input class="form-control" placeholder="Pincode"></div>
                        </div>
                    </form>
                </div>
                <div class="checkout-card p-4">
                    <h4 class="mb-3">Payment</h4>
                    <p class="text-muted">Secure Razorpay-style checkout for premium supplement orders.</p>
                    <button class="btn btn-primary py-3 px-4">Pay Now</button>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="checkout-card p-4">
                    <h4 class="mb-3">Order Summary</h4>
                    <div class="d-flex justify-content-between mb-2"><span>Nitro Whey Pro</span><span>₹4,999</span></div>
                    <div class="d-flex justify-content-between mb-2"><span>Recovery Fuel</span><span>₹5,798</span></div>
                    <div class="d-flex justify-content-between mb-2"><span>Shipping</span><span>₹199</span></div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold"><span>Total</span><span>₹10,996</span></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
