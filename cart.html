<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Shopping Cart</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="shared-navbar"></div>

    <!-- Cart Header Banner -->
    <div class="bg-dark text-white py-5 mb-4" style="margin-top: 75px;">
        <div class="container text-center py-3">
            <h1 class="display-6 fw-bold mb-2 text-white">Your Shopping Cart</h1>
            <p class="lead text-primary mb-0">Review your supplement stack before checkout.</p>
        </div>
    </div>

    <!-- Main Cart Content -->
    <div class="container pb-5">
        <div class="row g-4">
            <!-- Items Table/List -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <div id="cartItemsContainer">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="text-muted mt-2">Loading cart items...</p>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="shop.html" class="btn btn-outline-secondary px-4 py-2 rounded-3 fw-semibold">
                        <i class="fas fa-arrow-left me-2"></i>Continue Shopping
                    </a>
                </div>
            </div>

            <!-- Order Summary Card -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 100px;">
                    <h4 class="fw-bold mb-4">Order Summary</h4>
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>Subtotal</span>
                        <span id="cartSubtotal" class="fw-bold text-dark">₹0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>Estimated Shipping</span>
                        <span id="cartShipping" class="fw-bold text-dark">₹199</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>Estimated GST (18%)</span>
                        <span id="cartGst" class="fw-bold text-dark">₹0</span>
                    </div>
                    <hr class="my-3">
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Total Amount</span>
                        <span id="cartTotal" class="fs-4 fw-bold text-primary">₹0</span>
                    </div>

                    <button id="proceedCheckoutBtn" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm" onclick="location.href='checkout.html'">
                        Proceed to Checkout <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="shared-footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadCart() {
            const container = document.getElementById('cartItemsContainer');
            try {
                const res = await fetch('/api/cart');
                const data = await res.json();

                if (!data.success || !data.items || data.items.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-shopping-bag fa-4x text-muted mb-3 opacity-50"></i>
                            <h4 class="fw-bold mb-2">Your Cart is Empty</h4>
                            <p class="text-muted mb-4">Looks like you haven't added any supplements to your cart yet.</p>
                            <a href="shop.html" class="btn btn-primary px-4 py-2 rounded-3 fw-bold">Browse Products</a>
                        </div>
                    `;
                    document.getElementById('cartSubtotal').textContent = '₹0';
                    document.getElementById('cartShipping').textContent = '₹0';
                    document.getElementById('cartGst').textContent = '₹0';
                    document.getElementById('cartTotal').textContent = '₹0';
                    document.getElementById('proceedCheckoutBtn').disabled = true;
                    return;
                }

                document.getElementById('proceedCheckoutBtn').disabled = false;

                let subtotal = 0;
                let html = '<div class="table-responsive"><table class="table align-middle"><thead><tr class="text-muted border-bottom"><th>Product</th><th>Price</th><th class="text-center">Quantity</th><th class="text-end">Total</th><th></th></tr></thead><tbody>';

                data.items.forEach(item => {
                    const price = parseFloat(item.price);
                    const itemTotal = price * item.quantity;
                    subtotal += itemTotal;

                    html += `
                        <tr class="border-bottom">
                            <td class="py-3">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="${item.image_url || 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=200&q=80'}" class="rounded-3" style="width: 60px; height: 60px; object-fit: cover;" alt="${item.name}">
                                    <div>
                                        <h6 class="fw-bold mb-1">${item.name}</h6>
                                        <small class="text-muted">${item.brand || 'Protein Gallery'}</small>
                                    </div>
                                </div>
                            </td>
                            <td class="fw-semibold">₹${price.toLocaleString()}</td>
                            <td class="text-center" style="width: 140px;">
                                <div class="input-group input-group-sm">
                                    <button class="btn btn-outline-secondary" onclick="updateQty(${item.cart_id}, ${item.quantity - 1})">-</button>
                                    <input type="text" class="form-control text-center fw-bold" value="${item.quantity}" readonly>
                                    <button class="btn btn-outline-secondary" onclick="updateQty(${item.cart_id}, ${item.quantity + 1})">+</button>
                                </div>
                            </td>
                            <td class="text-end fw-bold text-dark">₹${itemTotal.toLocaleString()}</td>
                            <td class="text-end" style="width: 40px;">
                                <button class="btn btn-link text-danger p-0" onclick="removeItem(${item.cart_id})" title="Remove Item">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table></div>';
                container.innerHTML = html;

                const shipping = subtotal > 0 ? 199 : 0;
                const gst = Math.round(subtotal * 0.18);
                const total = subtotal + shipping + gst;

                document.getElementById('cartSubtotal').textContent = `₹${subtotal.toLocaleString()}`;
                document.getElementById('cartShipping').textContent = `₹${shipping}`;
                document.getElementById('cartGst').textContent = `₹${gst.toLocaleString()}`;
                document.getElementById('cartTotal').textContent = `₹${total.toLocaleString()}`;
            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger">Failed to load cart. Please refresh page.</div>`;
            }
        }

        async function updateQty(cartId, newQty) {
            try {
                const res = await fetch('/api/cart/update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart_id: cartId, quantity: newQty })
                });
                const data = await res.json();
                if (data.success) {
                    loadCart();
                    App.updateCartBadge();
                }
            } catch (err) {
                App.toast('Failed to update quantity.', 'error');
            }
        }

        async function removeItem(cartId) {
            try {
                const res = await fetch(`/api/cart/remove/${cartId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    App.toast(data.message, 'info');
                    loadCart();
                    App.updateCartBadge();
                }
            } catch (err) {
                App.toast('Failed to remove item.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
