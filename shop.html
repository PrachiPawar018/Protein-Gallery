<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Shop</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="protein supplements, whey, plant protein, nutrition" name="keywords">
    <meta content="Browse premium protein supplements and fitness nutrition products at Protein Gallery." name="description">
    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="shared-navbar"></div>

    <!-- Shop Page Banner -->
    <div class="bg-dark text-white py-5 mb-4" style="margin-top: 75px;">
        <div class="container text-center py-3">
            <h1 class="display-6 fw-bold mb-2 text-white">Shop Premium Supplements</h1>
            <p class="lead text-primary mb-0">100% Authentic, Lab-Tested Whey, Plant Protein & Gainers.</p>
        </div>
    </div>

    <div class="container-xxl py-4">
        <div class="container">
            <!-- Filter Bar -->
            <div class="row g-3 mb-4 bg-white p-3 rounded-4 shadow-sm border">
                <div class="col-lg-4 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search protein, brand, goal...">
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <select id="categorySelect" class="form-select">
                        <option value="">All Categories</option>
                        <option value="Whey Protein">Whey Protein</option>
                        <option value="Mass Gainer">Mass Gainer</option>
                        <option value="Creatine">Creatine</option>
                        <option value="Pre-Workout">Pre-Workout</option>
                        <option value="Vitamins">Vitamins</option>
                        <option value="Beginner Pack">Beginner Pack</option>
                    </select>
                </div>
                <div class="col-lg-3 col-md-6">
                    <select id="sortSelect" class="form-select">
                        <option value="featured">Sort by Featured</option>
                        <option value="price_low">Price: Low to High</option>
                        <option value="price_high">Price: High to Low</option>
                        <option value="rating">Top Rated</option>
                    </select>
                </div>
                <div class="col-lg-2 col-md-6">
                    <button id="resetFilterBtn" class="btn btn-outline-secondary w-100 fw-semibold">Reset Filters</button>
                </div>
            </div>

            <!-- Products Grid Container -->
            <div id="productsGrid" class="row g-4">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="text-muted mt-2">Loading products catalog...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="shared-footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/app.js"></script>
    <script>
        let allProducts = [];

        async function fetchProducts() {
            try {
                const search = document.getElementById('searchInput').value.trim();
                const category = document.getElementById('categorySelect').value;

                let url = '/api/products?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (category) url += `category=${encodeURIComponent(category)}&`;

                const res = await fetch(url);
                const data = await res.json();

                if (data.success && data.products) {
                    allProducts = data.products;
                    renderProductsGrid();
                }
            } catch (err) {
                document.getElementById('productsGrid').innerHTML = `<div class="alert alert-danger text-center">Failed to load product catalog.</div>`;
            }
        }

        function renderProductsGrid() {
            const container = document.getElementById('productsGrid');
            const sortBy = document.getElementById('sortSelect').value;

            let products = [...allProducts];

            if (sortBy === 'price_low') {
                products.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
            } else if (sortBy === 'price_high') {
                products.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
            } else if (sortBy === 'rating') {
                products.sort((a, b) => parseFloat(b.rating_avg || 0) - parseFloat(a.rating_avg || 0));
            }

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="section-shell p-5 text-center">
                            <i class="fas fa-box-open fa-3x text-muted mb-3 opacity-50"></i>
                            <h4 class="fw-bold mb-1">No products found</h4>
                            <p class="text-muted mb-0">Try adjusting your search criteria or category filter.</p>
                        </div>
                    </div>
                `;
                return;
            }

            let html = '';
            products.forEach(p => {
                const rating = parseFloat(p.rating_avg || 4.5);
                let stars = '';
                for (let i = 1; i <= 5; i++) {
                    stars += i <= Math.floor(rating) ? '<i class="fa fa-star text-warning"></i>' : '<i class="far fa-star text-warning"></i>';
                }

                const price = parseFloat(p.price);
                const discount = parseFloat(p.discount_percent || 0);
                const oldPrice = discount > 0 ? price / (1 - (discount / 100)) : price * 1.2;
                const imgUrl = App.getImageUrl(p.image_url, p);

                html += `
                    <div class="col-xl-3 col-lg-4 col-md-6">
                        <div class="product-item bg-white rounded-4 shadow-sm border overflow-hidden h-100 d-flex flex-column">
                            <div class="product-media position-relative text-center" style="height: 220px;">
                                <a href="single-product.html?id=${p.id}">
                                    <img class="img-fluid w-100 h-100" src="${imgUrl}" alt="${p.name}" style="object-fit: cover; object-position: center;">
                                </a>
                                <div class="product-overlay"></div>
                                <span class="badge ${p.stock > 0 ? 'bg-success' : 'bg-danger'} position-absolute start-0 top-0 m-3 px-3 py-2 rounded-pill font-monospace" style="font-size: 0.7rem;">${p.stock > 0 ? 'IN STOCK' : 'OUT OF STOCK'}</span>
                            </div>
                            <div class="p-4 d-flex flex-column flex-grow-1 text-center">
                                <div class="text-warning mb-2 small">${stars} <span class="text-muted ms-1">(${rating.toFixed(1)})</span></div>
                                <a class="h6 fw-bold mb-1 text-dark text-decoration-none text-truncate" href="single-product.html?id=${p.id}" title="${p.name}">${p.name}</a>
                                <p class="small text-muted mb-2">${p.brand || 'Protein Gallery'}</p>
                                <div class="d-flex justify-content-center flex-wrap gap-2 mb-3">
                                    <span class="product-chip">${p.category || 'Supplements'}</span>
                                    <span class="product-chip">${(p.goal_tag || 'performance').replace('-', ' ')}</span>
                                </div>
                                <p class="small text-muted mb-3">${p.description ? p.description.split('.')[0] : 'Premium formula designed for strength and recovery.'}</p>
                                
                                <div class="mt-auto">
                                    <div class="mb-3">
                                        <span class="fs-5 fw-bold text-primary me-2">₹${price.toLocaleString('en-IN')}</span>
                                        <span class="text-decoration-line-through text-muted small">₹${Math.round(oldPrice).toLocaleString('en-IN')}</span>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-primary fw-bold py-2 rounded-3 add-to-cart-btn" data-product-id="${p.id}">
                                            <i class="fa fa-shopping-bag me-2"></i>Add To Cart
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        document.getElementById('searchInput').addEventListener('input', fetchProducts);
        document.getElementById('categorySelect').addEventListener('change', fetchProducts);
        document.getElementById('sortSelect').addEventListener('change', renderProductsGrid);
        document.getElementById('resetFilterBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = '';
            document.getElementById('sortSelect').value = 'featured';
            fetchProducts();
        });

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const catParam = urlParams.get('category');
            if (catParam) {
                const select = document.getElementById('categorySelect');
                if (select) select.value = catParam;
            }
            fetchProducts();
        });
    </script>
</body>
</html>
