<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Account Dashboard</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="shared-navbar"></div>

    <!-- Profile Dashboard Container -->
    <div class="container py-5" style="margin-top: 90px;">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 text-center mb-4">
                    <div class="mx-auto mb-3 text-primary" style="font-size: 4rem;">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <h4 id="profileHeaderName" class="fw-bold mb-1">Loading...</h4>
                    <p id="profileHeaderEmail" class="text-muted small mb-3">-</p>
                    <div class="badge bg-primary text-white px-3 py-2 rounded-pill fw-semibold mb-4 d-inline-block" id="profileRole">USER</div>
                    
                    <div class="nav flex-column nav-pills text-start border-top pt-3" id="v-pills-tab" role="tablist">
                        <button class="nav-link active py-3 px-3 rounded-3 fw-semibold text-start mb-2" id="tab-profile-btn" data-bs-toggle="pill" data-bs-target="#tab-profile" type="button" role="tab">
                            <i class="fas fa-user me-2"></i>My Profile
                        </button>
                        <button class="nav-link py-3 px-3 rounded-3 fw-semibold text-start mb-2" id="tab-orders-btn" data-bs-toggle="pill" data-bs-target="#tab-orders" type="button" role="tab" onclick="loadOrders()">
                            <i class="fas fa-box-open me-2"></i>My Orders
                        </button>
                        <button class="nav-link py-3 px-3 rounded-3 fw-semibold text-start mb-2" id="tab-reviews-btn" data-bs-toggle="pill" data-bs-target="#tab-reviews" type="button" role="tab" onclick="loadReviews()">
                            <i class="fas fa-star me-2"></i>My Reviews
                        </button>
                        <button onclick="App.logout()" class="btn btn-outline-danger w-100 mt-3 py-2 fw-semibold rounded-3 text-start">
                            <i class="fas fa-sign-out-alt me-2"></i>Logout
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tab Contents -->
            <div class="col-lg-9">
                <div class="tab-content" id="v-pills-tabContent">
                    <!-- Tab 1: My Profile -->
                    <div class="tab-pane fade show active" id="tab-profile" role="tabpanel">
                        <!-- Profile Information Card -->
                        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mb-4">
                            <h4 class="fw-bold mb-4"><i class="fas fa-id-card text-primary me-2"></i>Personal Information</h4>
                            <form id="updateProfileForm">
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Full Name</label>
                                        <input type="text" id="profName" class="form-control py-2" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Email Address (Permanent)</label>
                                        <input type="email" id="profEmail" class="form-control py-2 bg-light" disabled>
                                    </div>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Phone Number</label>
                                        <input type="tel" id="profPhone" class="form-control py-2" placeholder="Enter phone number">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Account Created Date</label>
                                        <input type="text" id="profCreated" class="form-control py-2 bg-light" disabled>
                                    </div>
                                </div>

                                <button type="submit" id="saveProfBtn" class="btn btn-primary px-4 py-2 fw-bold rounded-3">
                                    Save Changes
                                </button>
                            </form>
                        </div>

                        <!-- Security / Change Password Card -->
                        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                            <h4 class="fw-bold mb-4"><i class="fas fa-lock text-primary me-2"></i>Security & Change Password</h4>
                            <form id="changePasswordForm">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Current Password</label>
                                    <input type="password" id="currPass" class="form-control py-2" placeholder="Enter current password" required>
                                </div>
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">New Password</label>
                                        <input type="password" id="newPass" class="form-control py-2" placeholder="Enter new password" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Confirm New Password</label>
                                        <input type="password" id="confirmPass" class="form-control py-2" placeholder="Confirm new password" required>
                                    </div>
                                </div>

                                <button type="submit" id="changePassBtn" class="btn btn-outline-primary px-4 py-2 fw-bold rounded-3">
                                    Update Password
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Tab 2: My Orders -->
                    <div class="tab-pane fade" id="tab-orders" role="tabpanel">
                        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                            <h4 class="fw-bold mb-4"><i class="fas fa-box text-primary me-2"></i>Order History</h4>
                            <div id="ordersContainer">
                                <div class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <p class="text-muted mt-2">Loading your orders...</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tab 3: My Reviews -->
                    <div class="tab-pane fade" id="tab-reviews" role="tabpanel">
                        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                            <h4 class="fw-bold mb-4"><i class="fas fa-star text-primary me-2"></i>My Product Reviews</h4>
                            <div id="reviewsContainer">
                                <div class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <p class="text-muted mt-2">Loading your reviews...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Review Modal -->
    <div class="modal fade" id="editReviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold">Edit Review</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="editReviewId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Rating</label>
                        <select id="editReviewRating" class="form-select">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Comment</label>
                        <textarea id="editReviewComment" class="form-control" rows="4" required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary rounded-3 fw-bold" onclick="saveReviewEdit()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <div id="shared-footer"></div>
    <script src="js/partials.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();

                if (!data.loggedIn || !data.user) {
                    App.toast('Please login to view your profile.', 'error');
                    setTimeout(() => window.location.href = 'login.html', 1000);
                    return;
                }

                const u = data.user;
                document.getElementById('profileHeaderName').textContent = u.name;
                document.getElementById('profileHeaderEmail').textContent = u.email;
                document.getElementById('profileRole').textContent = 'ROLE: ' + (u.role || 'USER');

                document.getElementById('profName').value = u.name || '';
                document.getElementById('profEmail').value = u.email || '';
                document.getElementById('profPhone').value = u.phone_number || '';
                document.getElementById('profCreated').value = u.created_at ? new Date(u.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'N/A';

                // Check query string for active tab
                const urlParams = new URLSearchParams(window.location.search);
                const tab = urlParams.get('tab');
                if (tab === 'orders') {
                    const btn = document.getElementById('tab-orders-btn');
                    if (btn) {
                        btn.click();
                    }
                } else if (tab === 'reviews') {
                    const btn = document.getElementById('tab-reviews-btn');
                    if (btn) {
                        btn.click();
                    }
                }
            } catch (err) {
                App.toast('Failed to load profile data.', 'error');
            }
        });

        // Update Profile Name & Phone
        document.getElementById('updateProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('profName').value.trim();
            const phone_number = document.getElementById('profPhone').value.trim();

            try {
                const res = await fetch('/api/user/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone_number })
                });
                const data = await res.json();
                if (data.success) {
                    App.toast(data.message, 'success');
                    document.getElementById('profileHeaderName').textContent = name;
                } else {
                    App.toast(data.message, 'error');
                }
            } catch (err) {
                App.toast('Failed to update profile.', 'error');
            }
        });

        // Change Password
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currPass').value;
            const newPassword = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;

            if (newPassword !== confirmPass) {
                App.toast('New passwords do not match!', 'error');
                return;
            }

            try {
                const res = await fetch('/api/user/change-password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const data = await res.json();
                if (data.success) {
                    App.toast(data.message, 'success');
                    document.getElementById('changePasswordForm').reset();
                } else {
                    App.toast(data.message, 'error');
                }
            } catch (err) {
                App.toast('Failed to change password.', 'error');
            }
        });

        // Load Orders
        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();

                if (!data.success || !data.orders || data.orders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-box-open fa-3x text-muted mb-3 opacity-50"></i>
                            <h5 class="fw-bold mb-1">No Orders Found</h5>
                            <p class="text-muted mb-3">You haven't placed any orders yet.</p>
                            <a href="shop.html" class="btn btn-primary btn-sm rounded-3 fw-bold">Shop Now</a>
                        </div>
                    `;
                    return;
                }

                let html = '';
                data.orders.forEach(o => {
                    const dateStr = new Date(o.created_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    let statusBadgeClass = 'bg-secondary';
                    if (o.status === 'CONFIRMED') statusBadgeClass = 'bg-primary';
                    else if (o.status === 'SHIPPED') statusBadgeClass = 'bg-info text-dark';
                    else if (o.status === 'DELIVERED') statusBadgeClass = 'bg-success';
                    else if (o.status === 'CANCELLED') statusBadgeClass = 'bg-danger';
                    else if (o.status === 'PENDING') statusBadgeClass = 'bg-warning text-dark';

                    let itemsHtml = '';
                    if (o.items && o.items.length > 0) {
                        itemsHtml = o.items.map(item => `
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom">
                                <img src="${App.getImageUrl(item.image_url)}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;" alt="">
                                <div class="flex-grow-1">
                                    <div class="fw-bold small text-dark">${item.product_name}</div>
                                    <small class="text-muted">Qty: ${item.quantity} × ₹${parseFloat(item.price).toLocaleString('en-IN')}</small>
                                </div>
                                <span class="fw-semibold small">₹${(parseFloat(item.price) * item.quantity).toLocaleString('en-IN')}</span>
                            </div>
                        `).join('');
                    }

                    html += `
                        <div class="card border rounded-4 mb-4 overflow-hidden shadow-sm">
                            <div class="card-header bg-light p-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                                <div>
                                    <span class="fw-bold text-dark me-2">Order #${o.id}</span>
                                    <small class="text-muted">| ${dateStr}</small>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge ${statusBadgeClass} px-3 py-2 rounded-pill font-monospace">${o.status}</span>
                                    <span class="badge bg-outline-dark border text-dark px-2 py-1 small">${o.payment_method || 'COD'}</span>
                                </div>
                            </div>
                            <div class="card-body p-4">
                                <div class="mb-3">${itemsHtml}</div>
                                <div class="row pt-2 text-muted small">
                                    <div class="col-md-6 mb-2">
                                        <strong>Shipping Address:</strong><br>${o.shipping_address || 'N/A'}
                                    </div>
                                    <div class="col-md-6 text-md-end">
                                        <div><strong>Tracking Number:</strong> <span class="font-monospace text-primary fw-bold">${o.tracking_number || 'N/A'}</span></div>
                                        <div class="fs-5 fw-bold text-dark mt-2">Total Amount: <span class="text-primary">₹${parseFloat(o.total_amount).toLocaleString('en-IN')}</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger text-center">Failed to load orders history.</div>`;
            }
        }

        // Load Reviews
        async function loadReviews() {
            const container = document.getElementById('reviewsContainer');
            try {
                const res = await fetch('/api/user/reviews');
                const data = await res.json();

                if (!data.success || !data.reviews || data.reviews.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-star fa-3x text-muted mb-3 opacity-50"></i>
                            <h5 class="fw-bold mb-1">No Reviews Submitted</h5>
                            <p class="text-muted mb-3">You haven't reviewed any products yet.</p>
                            <a href="shop.html" class="btn btn-primary btn-sm rounded-3 fw-bold">Write a Review on Shop</a>
                        </div>
                    `;
                    return;
                }

                let html = '';
                data.reviews.forEach(r => {
                    const dateStr = new Date(r.created_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
                    let stars = '';
                    for (let i = 1; i <= 5; i++) {
                        stars += i <= r.rating ? '<i class="fa fa-star text-warning me-1"></i>' : '<i class="far fa-star text-warning me-1"></i>';
                    }

                    html += `
                        <div class="card border rounded-4 mb-3 p-4 shadow-sm">
                            <div class="d-flex justify-content-between align-items-start gap-3">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="${App.getImageUrl(r.image_url)}" class="rounded-3" style="width: 55px; height: 55px; object-fit: cover;" alt="">
                                    <div>
                                        <h6 class="fw-bold mb-1 text-dark">${r.product_name}</h6>
                                        <div class="mb-1">${stars} <span class="small text-muted font-monospace">(${r.rating}/5)</span></div>
                                        <small class="text-muted">Reviewed on ${dateStr}</small>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-sm btn-outline-primary rounded-3" onclick="openEditReviewModal(${r.id}, ${r.rating}, '${escapeHtml(r.comment)}')">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger rounded-3" onclick="deleteReview(${r.id})">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                            <hr class="my-3">
                            <p class="mb-0 text-dark font-italic">"${r.comment}"</p>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger text-center">Failed to load product reviews.</div>`;
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function openEditReviewModal(id, rating, comment) {
            document.getElementById('editReviewId').value = id;
            document.getElementById('editReviewRating').value = rating;
            document.getElementById('editReviewComment').value = comment;

            const modal = new bootstrap.Modal(document.getElementById('editReviewModal'));
            modal.show();
        }

        async function saveReviewEdit() {
            const id = document.getElementById('editReviewId').value;
            const rating = parseInt(document.getElementById('editReviewRating').value);
            const comment = document.getElementById('editReviewComment').value.trim();

            if (!comment) {
                App.toast('Comment cannot be empty.', 'error');
                return;
            }

            try {
                const res = await fetch(`/api/reviews/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rating, comment })
                });
                const data = await res.json();
                if (data.success) {
                    App.toast(data.message, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('editReviewModal')).hide();
                    loadReviews();
                } else {
                    App.toast(data.message, 'error');
                }
            } catch (err) {
                App.toast('Failed to update review.', 'error');
            }
        }

        async function deleteReview(id) {
            if (!confirm('Are you sure you want to delete this review?')) return;

            try {
                const res = await fetch(`/api/reviews/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    App.toast(data.message, 'success');
                    loadReviews();
                } else {
                    App.toast(data.message, 'error');
                }
            } catch (err) {
                App.toast('Failed to delete review.', 'error');
            }
        }
    </script>
</body>
</html>
