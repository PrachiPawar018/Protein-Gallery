<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | My Orders</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="shared-navbar"></div>

    <!-- Header Banner -->
    <div class="bg-dark text-white py-5 mb-4" style="margin-top: 75px;">
        <div class="container text-center py-3">
            <h1 class="display-6 fw-bold mb-2 text-white">My Supplement Orders</h1>
            <p class="lead text-primary mb-0">Track delivery status, view items, and access order invoices.</p>
        </div>
    </div>

    <!-- Container -->
    <div class="container pb-5">
        <div class="row">
            <div class="col-lg-12">
                <div id="ordersContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="text-muted mt-2">Loading your order history...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="shared-footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadUserOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();

                if (!data.success || !data.orders || data.orders.length === 0) {
                    container.innerHTML = `
                        <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
                            <i class="fas fa-box-open fa-4x text-muted mb-3 opacity-50"></i>
                            <h4 class="fw-bold mb-2">No Orders Found</h4>
                            <p class="text-muted mb-4">You haven't placed any orders yet. Explore our supplements and start your fitness stack today!</p>
                            <div>
                                <a href="shop.html" class="btn btn-primary px-4 py-2 rounded-3 fw-bold">Shop Supplements</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                data.orders.forEach(order => {
                    const createdDate = new Date(order.created_at).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    let statusBadgeClass = 'bg-primary';
                    if (order.status === 'PAID') statusBadgeClass = 'bg-success';
                    if (order.status === 'SHIPPED') statusBadgeClass = 'bg-info text-dark';
                    if (order.status === 'DELIVERED') statusBadgeClass = 'bg-dark';

                    let itemsHtml = '';
                    if (order.items && order.items.length > 0) {
                        order.items.forEach(item => {
                            itemsHtml += `
                                <div class="d-flex align-items-center justify-content-between py-2 border-bottom">
                                    <div class="d-flex align-items-center gap-3">
                                        <img src="${item.image_url || 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=120&q=80'}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;" alt="">
                                        <div>
                                            <h6 class="fw-bold mb-0">${item.product_name}</h6>
                                            <small class="text-muted">${item.brand || 'Protein Gallery'} | ${item.quantity} × ₹${parseFloat(item.price).toLocaleString()}</small>
                                        </div>
                                    </div>
                                    <span class="fw-bold text-dark">₹${(parseFloat(item.price) * item.quantity).toLocaleString()}</span>
                                </div>
                            `;
                        });
                    }

                    html += `
                        <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
                            <div class="card-header bg-white p-4 border-bottom d-flex flex-wrap justify-content-between align-items-center gap-3">
                                <div>
                                    <span class="badge ${statusBadgeClass} me-2 px-3 py-2 rounded-pill fw-semibold">${order.status}</span>
                                    <strong class="fs-5 me-3">Order #${order.id}</strong>
                                    <span class="text-muted small"><i class="far fa-clock me-1"></i>${createdDate}</span>
                                </div>
                                <div class="text-end">
                                    <span class="text-muted small me-2">Tracking Number:</span>
                                    <span class="badge bg-light text-dark border font-monospace">${order.tracking_number || 'PG-TRACK-WAITING'}</span>
                                </div>
                            </div>
                            <div class="card-body p-4">
                                <div class="row g-4">
                                    <div class="col-lg-8">
                                        <h6 class="fw-bold mb-3 text-muted">Ordered Items</h6>
                                        ${itemsHtml}
                                    </div>
                                    <div class="col-lg-4 border-start-lg">
                                        <h6 class="fw-bold mb-3 text-muted">Payment & Shipping Summary</h6>
                                        <div class="d-flex justify-content-between mb-2 small">
                                            <span>Payment Method:</span>
                                            <span class="fw-bold text-uppercase">${order.payment_method || 'RAZORPAY'}</span>
                                        </div>
                                        <div class="d-flex justify-content-between mb-2 small">
                                            <span>Payment ID:</span>
                                            <span class="font-monospace small text-primary">${order.razorpay_payment_id || 'pay_demo_success'}</span>
                                        </div>
                                        <div class="d-flex justify-content-between mb-2 small">
                                            <span>Coupon Applied:</span>
                                            <span class="fw-bold text-success">${order.coupon_code || 'None'}</span>
                                        </div>
                                        <hr class="my-2">
                                        <div class="d-flex justify-content-between mb-2">
                                            <span class="fw-bold">Total Paid:</span>
                                            <span class="fs-5 fw-bold text-primary">₹${parseFloat(order.total_amount).toLocaleString()}</span>
                                        </div>
                                        <div class="mt-3 p-3 bg-light rounded-3 small">
                                            <strong class="d-block mb-1 text-dark"><i class="fas fa-map-marker-alt text-primary me-1"></i>Shipping Address:</strong>
                                            <span class="text-muted">${order.shipping_address || 'Address provided at checkout'}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger">Failed to load order history.</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadUserOrders);
    </script>
</body>
</html>
