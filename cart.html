<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Cart</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="cart-item p-4 mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Nitro Whey Pro</h5>
                            <p class="text-muted mb-0">1 × ₹4,999</p>
                        </div>
                        <div class="text-end">
                            <div class="price">₹4,999</div>
                            <a href="#" class="small text-primary">Remove</a>
                        </div>
                    </div>
                </div>
                <div class="cart-item p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Recovery Fuel</h5>
                            <p class="text-muted mb-0">2 × ₹2,899</p>
                        </div>
                        <div class="text-end">
                            <div class="price">₹5,798</div>
                            <a href="#" class="small text-primary">Remove</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="checkout-card p-4">
                    <h4 class="mb-3">Order Summary</h4>
                    <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><span>₹10,797</span></div>
                    <div class="d-flex justify-content-between mb-2"><span>Shipping</span><span>₹199</span></div>
                    <div class="d-flex justify-content-between mb-2"><span>GST</span><span>₹1,296</span></div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold"><span>Total</span><span>₹12,292</span></div>
                    <a href="checkout.html" class="btn btn-primary w-100 mt-4">Proceed to Checkout</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
