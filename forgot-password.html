<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Forgot Password</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card p-5 wow fadeInUp">
                    <h2 class="mb-3">Reset your password</h2>
                    <p class="text-muted mb-4">We’ll send an OTP to your registered email.</p>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" class="form-control" placeholder="you@example.com">
                        </div>
                        <button class="btn btn-primary w-100 py-3">Send OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
