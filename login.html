<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Protein Gallery | Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="shared-navbar"></div>

    <!-- Login Container -->
    <div class="container py-5" style="margin-top: 100px;">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card p-4 p-md-5 bg-white shadow-lg rounded-4 border-0">
                    <div class="text-center mb-4">
                        <div class="brand-mark mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
                            <i class="fas fa-user-lock"></i>
                        </div>
                        <h2 class="fw-bold mb-2">Welcome Back</h2>
                        <p class="text-muted">Sign in to access your orders, cart, and profile.</p>
                    </div>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="loginEmail" class="form-control border-start-0 py-2" placeholder="you@example.com" required>
                            </div>
                            <div class="invalid-feedback" id="emailFeedback">Please enter a valid email address.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="loginPassword" class="form-control border-start-0 border-end-0 py-2" placeholder="••••••••" required>
                                <button type="button" class="btn btn-light border border-start-0 toggle-password" data-target="loginPassword">
                                    <i class="fas fa-eye text-muted"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback" id="passwordFeedback">Please enter your password.</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 small">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-muted" for="rememberMe">Remember Me</label>
                            </div>
                            <a href="forgot-password.html" class="text-primary fw-semibold text-decoration-none">Forgot password?</a>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-3 fw-bold rounded-3 d-flex align-items-center justify-content-center gap-2">
                            <span>Sign In</span>
                            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top small">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="register.html" class="text-primary fw-bold ms-1 text-decoration-none">Create Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="shared-footer"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Toast notification helper
        function showToast(message, type = 'info') {
            if (window.App && App.toast) {
                App.toast(message, type);
            } else {
                alert(message);
            }
        }

        // Login Form Handler with REST API
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginSpinner');

            // Validation
            if (!email || !email.includes('@')) {
                showToast('Please enter a valid email address.', 'error');
                return;
            }
            if (!password) {
                showToast('Please enter your password.', 'error');
                return;
            }

            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await res.json();

                if (result.success) {
                    showToast('✓ Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1200);
                } else {
                    showToast(result.message || 'Invalid email or password.', 'error');
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                }
            } catch (err) {
                showToast('An error occurred. Please try again.', 'error');
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
