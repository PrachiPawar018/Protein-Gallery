<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders | Protein Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header-bar">
    <div class="container navbar">
        <a class="brand" href="index.html"><span class="dot">PG</span> Protein Gallery</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="orders.html" class="active">Orders</a>
            <a href="cart.html">Cart</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html" id="navAdmin" style="display:none;">Admin</a>
        </nav>
        <div class="nav-actions">
            <div id="navAuth" class="nav-auth">
                <a class="btn-secondary" href="login.html">Login</a>
                <a class="btn-primary" href="register.html">Sign Up</a>
            </div>
            <div id="navUser" class="user-menu" style="display:none; gap:12px; align-items:center;">
                <span class="user-name"></span>
                <button class="btn-secondary" id="logoutButton">Logout</button>
            </div>
        </div>
    </div>
</header>
<div id="toast-container"></div>
<main class="container page-header">
    <div class="section-header">
        <h1 class="section-title">Order history</h1>
        <p class="section-subtitle">Track your past purchases and order status.</p>
    </div>
    <div id="orderList"></div>
</main>
<script src="js/main.js"></script>
<script>
    async function loadOrders() {
        const orders = await fetchJson(`${api.orders}/history`);
        const container = document.getElementById('orderList');
        if (!Array.isArray(orders) || orders.length === 0) {
            container.innerHTML = '<div class="card"><p style="color:var(--muted);">No orders found yet.</p></div>';
            return;
        }
        container.innerHTML = orders.map(order => `
            <div class="card" style="margin-bottom:18px;">
                <div class="list-row">
                    <h3>Order #${order.id}</h3>
                    <span>${order.createdAt}</span>
                </div>
                <p style="color:var(--muted);">Status: ${order.status} — Payment: ${order.paymentStatus}</p>
                <div style="margin-top:16px;">
                    ${order.items.map(item => `
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <span>${item.productName} × ${item.quantity}</span>
                            <strong>${formatCurrency(item.unitPrice)}</strong>
                        </div>
                    `).join('')}
                </div>
                <div class="price-tag" style="margin-top:20px;">Total: ${formatCurrency(order.totalAmount)}</div>
            </div>
        `).join('');
    }
    document.addEventListener('DOMContentLoaded', loadOrders);
</script>
</body>
</html>
