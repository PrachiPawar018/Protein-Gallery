<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Confirmed | Protein Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header-bar">
    <div class="container navbar">
        <a class="brand" href="index.html"><span class="dot">PG</span> Protein Gallery</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="orders.html">Orders</a>
            <a href="cart.html">Cart</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html" id="navAdmin" style="display:none;">Admin</a>
        </nav>
        <div class="nav-actions">
            <div id="navAuth" class="nav-auth">
                <a class="btn-secondary" href="login.html">Login</a>
                <a class="btn-primary" href="register.html">Sign Up</a>
            </div>
            <div id="navUser" class="user-menu" style="display:none; gap:12px; align-items:center;">
                <span class="user-name"></span>
                <button class="btn-secondary" id="logoutButton">Logout</button>
            </div>
        </div>
    </div>
</header>
<div id="toast-container"></div>
<main class="container page-header">
    <div class="section-header">
        <h1 class="section-title">Thanks for your order!</h1>
        <p class="section-subtitle">Your purchase is confirmed. We are preparing it for shipment.</p>
    </div>
    <div class="card summary-card">
        <h3>Order details</h3>
        <p id="successMessage" style="color:var(--muted);"></p>
        <div class="button-row" style="justify-content:flex-start; gap:12px; margin-top:16px;">
            <a class="btn-primary" href="shop.html">Continue shopping</a>
            <a class="btn-secondary" href="orders.html">View orders</a>
        </div>
    </div>
</main>
<script src="js/main.js"></script>
<script>
    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }
    document.addEventListener('DOMContentLoaded', () => {
        const orderId = getQueryParam('orderId');
        const message = orderId ? `Your order #${orderId} is placed successfully.` : 'Your checkout completed successfully.';
        document.getElementById('successMessage').textContent = message;
    });
</script>
</body>
</html>
