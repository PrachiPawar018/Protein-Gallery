<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Protein Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header-bar">
    <div class="container navbar">
        <a class="brand" href="index.html"><span class="dot">PG</span> Protein Gallery</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
        </nav>
    </div>
</header>
<div id="toast-container"></div>
<main class="container page-header">
    <div class="card" style="max-width:520px; margin: 0 auto;">
        <h2>Login to your account</h2>
        <p>Enter your email and password to continue shopping.</p>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input class="text-field" type="email" id="email" name="email" required />
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input class="text-field" type="password" id="password" name="password" required />
            </div>
            <button class="btn-primary" type="submit">Login</button>
            <p style="margin-top:18px; color:var(--muted);">New to Protein Gallery? <a href="register.html">Create account</a></p>
        </form>
    </div>
</main>
<script src="js/main.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const data = new FormData(form);
        const payload = new URLSearchParams();
        data.forEach((value, key) => payload.append(key, value));
        const result = await fetchJson(`${api.auth}/login`, {
            method: 'POST',
            body: payload,
        });
        showToast(result.message, result.success ? 'success' : 'error');
        if (result.success) {
            setTimeout(() => window.location.href = 'index.html', 700);
        }
    });
</script>
</body>
</html>
