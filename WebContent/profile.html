<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Protein Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header-bar">
    <div class="container navbar">
        <a class="brand" href="index.html"><span class="dot">PG</span> Protein Gallery</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">Orders</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="admin.html" id="navAdmin" style="display:none;">Admin</a>
        </nav>
        <div class="nav-actions">
            <div id="navAuth" class="nav-auth">
                <a class="btn-secondary" href="login.html">Login</a>
                <a class="btn-primary" href="register.html">Sign Up</a>
            </div>
            <div id="navUser" class="user-menu" style="display:none; gap:12px; align-items:center;">
                <span class="user-name"></span>
                <button class="btn-secondary" id="logoutButton">Logout</button>
            </div>
        </div>
    </div>
</header>
<div id="toast-container"></div>
<main class="container page-header">
    <div class="section-header">
        <h1 class="section-title">Your profile</h1>
        <p class="section-subtitle">Manage your account, update credentials, and view order history.</p>
    </div>
    <div class="product-detail">
        <section class="summary-card card">
            <h2>Account details</h2>
            <div id="profileInfo" class="profile-info"></div>
        </section>
        <aside class="summary-card card">
            <h3>Change password</h3>
            <form id="passwordForm" class="form-grid">
                <div class="input-group">
                    <label for="oldPassword">Current password</label>
                    <input class="text-field" type="password" id="oldPassword" name="oldPassword" required />
                </div>
                <div class="input-group">
                    <label for="newPassword">New password</label>
                    <input class="text-field" type="password" id="newPassword" name="newPassword" required />
                </div>
                <button class="btn-primary" type="submit">Update password</button>
            </form>
        </aside>
    </div>
</main>
<script src="js/main.js"></script>
<script>
    async function loadProfile() {
        const session = await getSession();
        if (!session.authenticated) {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('profileInfo').innerHTML = `
            <p><strong>Name:</strong> ${session.name}</p>
            <p><strong>Email:</strong> ${session.email}</p>
            <p><strong>Role:</strong> ${session.role}</p>
        `;
    }

    document.getElementById('passwordForm').addEventListener('submit', async event => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const payload = new URLSearchParams();
        data.forEach((value, key) => payload.append(key, value));
        const result = await fetchJson(`${api.auth}/change-password`, {
            method: 'POST',
            body: payload,
        });
        showToast(result.message, result.success ? 'success' : 'error');
    });

    document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
