<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Protein Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header-bar">
    <div class="container navbar">
        <a class="brand" href="index.html"><span class="dot">PG</span> Protein Gallery</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="orders.html">Orders</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html" id="navAdmin" style="display:none;">Admin</a>
        </nav>
        <div class="nav-actions">
            <div id="navAuth" class="nav-auth">
                <a class="btn-secondary" href="login.html">Login</a>
                <a class="btn-primary" href="register.html">Sign Up</a>
            </div>
            <div id="navUser" class="user-menu" style="display:none; gap:12px; align-items:center;">
                <span class="user-name"></span>
                <button class="btn-secondary" id="logoutButton">Logout</button>
            </div>
        </div>
    </div>
</header>
<div id="toast-container"></div>
<main class="container page-header">
    <section class="card form-panel" style="max-width:560px; margin: 0 auto;">
        <div class="section-header">
            <h1 class="section-title">Welcome back</h1>
            <p class="section-subtitle">Sign in to access your account, orders, and saved cart.</p>
        </div>
        <form id="loginForm" class="form-grid">
            <div class="input-group">
                <label for="email">Email</label>
                <input class="text-field" type="email" id="email" name="email" required />
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input class="text-field" type="password" id="password" name="password" required />
            </div>
            <button class="btn-primary" type="submit">Login</button>
            <p class="form-caption">New to Protein Gallery? <a href="register.html">Create account</a></p>
        </form>
    </section>
</main>
<script src="js/main.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        setFormSubmitting(form, true);
        clearFieldErrors(form);
        const data = new FormData(form);
        const payload = new URLSearchParams();
        data.forEach((value, key) => payload.append(key, value));
        const result = await fetchJson(`${api.auth}/login`, {
            method: 'POST',
            body: payload,
        });
        setFormSubmitting(form, false);
        showToast(result.message, result.success ? 'success' : 'error');
        if (result.success && result.redirectTo) {
            setTimeout(() => window.location.href = result.redirectTo, 700);
        }
    });
</script>
</body>
</html>
